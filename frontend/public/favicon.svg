<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Graduation cap / mortarboard icon -->
  <defs>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#475569"/>
      <stop offset="100%" style="stop-color:#334155"/>
    </linearGradient>
  </defs>
  <!-- Base / top of cap -->
  <polygon points="16,4 28,10 16,16 4,10" fill="url(#cap)"/>
  <!-- Cap band -->
  <polygon points="16,14 24,10 24,12 16,16 8,12 8,10" fill="#334155"/>
  <!-- Tassel -->
  <line x1="24" y1="10" x2="24" y2="20" stroke="#f59e0b" stroke-width="1.5"/>
  <circle cx="24" cy="21" r="2" fill="#f59e0b"/>
  <!-- Bottom plate -->
  <ellipse cx="16" cy="16" rx="10" ry="3" fill="url(#cap)" opacity="0.9"/>
</svg>
