<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <style>
    .cap-top { fill: #475569; }
    .cap-band { fill: #334155; }
    .tassel { stroke: #f59e0b; fill: #f59e0b; }
    .plate { fill: #475569; }
    
    @media (prefers-color-scheme: dark) {
      .cap-top { fill: #94a3b8; }
      .cap-band { fill: #cbd5e1; }
      .plate { fill: #94a3b8; }
    }
  </style>
  <!-- Base / top of cap -->
  <polygon class="cap-top" points="16,4 28,10 16,16 4,10"/>
  <!-- Cap band -->
  <polygon class="cap-band" points="16,14 24,10 24,12 16,16 8,12 8,10"/>
  <!-- Tassel -->
  <line class="tassel" x1="24" y1="10" x2="24" y2="20" stroke-width="1.5"/>
  <circle class="tassel" cx="24" cy="21" r="2"/>
  <!-- Bottom plate -->
  <ellipse class="plate" cx="16" cy="16" rx="10" ry="3" opacity="0.9"/>
</svg>
